parameters:
    loan.available_terms: [12, 24, 36, 48, 60]
    loan.min_rate: 3.0
    loan.max_rate: 10.0
    exchange_rate.timeout_seconds: 1.5

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Domain\Loan\Service\ExchangeRate\ExchangeRateProviderInterface:
            tags: ['app.exchange_rate_provider']
        App\Domain\Loan\Service\LoanStrategy\PaymentCalculationStrategyInterface:
            tags: ['app.payment_strategy']

    # Domain layer
    App\Domain\:
        resource: '../src/Domain/'
        exclude:
            - '../src/Domain/**/Entity/'
            - '../src/Domain/**/ValueObject/'
            - '../src/Domain/**/Exception/'

    # Application layer
    App\Application\:
        resource: '../src/Application/'

    # Infrastructure
    App\Infrastructure\:
        resource: '../src/Infrastructure/'

    App\Infrastructure\Client\ExchangeRate\:
        resource: '../src/Infrastructure/Client/ExchangeRate/'
        bind:
            $timeoutSeconds: '%exchange_rate.timeout_seconds%'

    # Presentation layer
    App\Presentation\Controller\:
        resource: '../src/Presentation/Controller/'
        tags: ['controller.service_arguments']

    App\Domain\Loan\Service\LoanStrategy\PaymentStrategyResolver:
        arguments:
            $strategies: !tagged_iterator app.payment_strategy

    App\Domain\Loan\Service\LoanConditionsGenerator:
        arguments:
            $availableTerms: '%loan.available_terms%'
            $minRate: '%loan.min_rate%'
            $maxRate: '%loan.max_rate%'

    App\Infrastructure\Client\ExchangeRate\ExchangeRateService:
        arguments:
            $providers: !tagged_iterator app.exchange_rate_provider

    App\Domain\Loan\Service\ExchangeRate\ExchangeRateServiceInterface:
        alias: App\Infrastructure\Client\ExchangeRate\ExchangeRateService

    Amp\Http\Client\HttpClient:
        factory: ['Amp\Http\Client\HttpClientBuilder', 'buildDefault']
