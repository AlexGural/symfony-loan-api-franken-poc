services:
  frankenphp:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    ports:
      - "8081:80"
    volumes:
      - .:/app
      - ./docker/frankenphp/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://app:secret@postgres:5432/app_db?serverVersion=17&charset=utf8"
#      APP_ENV: dev
#      APP_DEBUG: 1
      APP_ENV: prod    # for benchmark
      APP_DEBUG: 0     # for benchmark
      SERVER_NAME: ":80"
      FRANKEN_WORKERS: 8
      FRANKEN_MAX_REQUEST_RESTART: 700

  postgres:
    image: postgres:17-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - franken_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  franken_postgres_data:
